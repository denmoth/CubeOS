// Шрифты системы (команда fonts, D239). Свой выбор пользователь хранит в $cfg/fonts.conf (команда fonts set).
// Шрифт это файл .font в /cubeos/share/fonts, в языковом пакете (/cubeos/share/lang/<язык>/fonts) или в $data/fonts.
{
  terminal: "cube-mono-6x9",   // основной шрифт пиксельного терминала
  fallback: [],                // запасные шрифты того же размера клетки для букв, которых нет в основном (потом все остальные такого же размера)
}
