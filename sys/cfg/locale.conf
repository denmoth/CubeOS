// Язык и клавиатура системы (docs/18-plan-terminal-security.md, D232, D235).
{
  lang: "en",              // язык текста системы: en, ru, uk (свой язык пользователь задаёт командой locale set)
                           // без CC:Graphics текст остаётся английским: обычный терминал CC не рисует кириллицу
  keyboard: "ru",          // второй язык клавиатуры (английский есть всегда): ru, uk или другой из assets/layouts
  keyboard_mode: "auto",   // "auto": раскладка как в Windows (переключать в Windows); "manual": переключать в CubeOS Ctrl+Shift
}
