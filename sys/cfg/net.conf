// Сеть (служба netd, команда net). Ключи сопряжения лежат отдельно: /cubeos/sys/sec/net_keys.lock
{
  name: "",          // имя компьютера в сети ("" - метка компьютера или pc-<номер>); net name ИМЯ
  wireless: false,   // true: общие папки и сопряжение и через беспроводной модем
  encrypt: "on",     // "on": своё шифруем (ChaCha20), принимаем и открытое; "require": принимаем только зашифрованное; "off": открытым текстом
  shares: {},        // общие папки этого компьютера: {ИМЯ: {path, readonly}}; net share / net unshare
  mounts: [],        // папки других компьютеров, монтируются при загрузке; net mount / net unmount
}
