// Время системы (служба timed, команды date и timedatectl). Подробности: docs/spec/time.md
{
  source: "utc",          // "utc": реальное время (os.epoch("utc")); "ingame": время суток и день Minecraft
  tz: "UTC",              // смещение ("+03:00") или зона IANA ("Europe/Kyiv", "Asia/Tokyo", ...); timedatectl list-timezones [страна]
  dst: "auto",            // "auto": по правилам зоны; "off": без перехода; "+01:00": всегда добавлять это смещение
  seconds: false,         // секунды в часах (панель, fetch, date)
  format: "24h",          // "24h" или "12h"
  date_format: "%Y-%m-%d",
  week_start: "monday",   // "monday", "sunday" или "saturday"
  locale: "en",           // названия дней и месяцев: "en", "ru", "uk"
  drift_ms: 2000,         // насколько часы могут разойтись с монотонным временем, прежде чем разослать time_changed
  // zones: { "My/Zone": { offset: "+02:00", dst: "eu" } },   // свои зоны (dst: "", "eu", "us", "au")
}
