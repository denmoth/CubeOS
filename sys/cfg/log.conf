// Журнал системы (служба logd, команда logs). Подробности: docs/spec/logging.md
{
  level: "info",        // debug, info, warn, error, crit: что записывать
  max_size: 65536,      // размер файла журнала в байтах, после которого он уходит в архив
  keep: 4,              // сколько архивов хранить (system.log.1 ... system.log.4)
  rotate_boots: true,   // при каждой загрузке system.log уходит в архив
  kernel: true,         // строки журнала ядра тоже пишутся (уровень debug, видны при level: "debug")
}
