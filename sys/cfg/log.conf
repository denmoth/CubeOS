// Журнал системы (служба logd, команды logs и inputlog). Подробности: docs/spec/services.md
{
  level: "info",        // debug, info, warn, error, crit: что записывать
  max_size: 65536,      // размер файла журнала в байтах, после которого он уходит в архив
  keep: 4,              // сколько архивов хранить (system.log.1 ... system.log.4)
  rotate_boots: true,   // при каждой загрузке system.log уходит в архив
  kernel: true,         // строки журнала ядра тоже пишутся (уровень debug, видны при level: "debug")
  max_total: 131072,    // все журналы вместе, байт: сверх этого удаляются самые старые архивы (0: без предела)
  max_age_days: 7,      // архивы старше стольких дней удаляются (0: не удалять)

  // журнал ввода (команда inputlog, пункт меню загрузки «CubeOS (input log)»): пишет каждую клавишу, кроме паролей
  input_ttl_minutes: 90,   // через столько минут после включения он выключается, а файл удаляется через столько же после создания
  input_delete: true,      // false: файл input.log не удалять по сроку
  input_max_size: 65536,   // байт: дальше журнал ввода выключается сам
}
