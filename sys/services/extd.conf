// Расширители хранилища (docs/21-axo.md, подшаг 6): дискеты и общие папки с меткой подключаются туда, где были.
// Подробности: lib/svc/extd.cub, свой список: /cubeos/sys/cfg/extenders.conf
{
  name: "extd",
  module: "svc.extd",
  after: ["logd", "devd", "netd"],
  ready: "register",
  restart: "on-failure",
  safe: false,
}
